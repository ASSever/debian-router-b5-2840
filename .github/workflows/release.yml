name: Publish release
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Roadmap stage number for this package release
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Name the release
        id: version
        shell: bash
        env:
          RELEASE_STAGE: ${{ inputs.stage }}
        run: |
          case "$RELEASE_STAGE" in
            ''|0|*[!0-9]*)
              echo "stage must be a positive integer" >&2
              exit 1
              ;;
          esac
          echo "value=0.1.0-step${RELEASE_STAGE}-$(TZ=Europe/Moscow date +%Y%m%d-%H%M)-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build and verify the package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sh scripts/package.sh "$VERSION"
          cd "dist/$VERSION"
          sha256sum -c "debian-router-b5-2840-$VERSION.tar.gz.sha256"
          tar -tzf "debian-router-b5-2840-$VERSION.tar.gz"
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_STAGE: ${{ inputs.stage }}
        run: |
          mkdir release
          cp "dist/$VERSION/debian-router-b5-2840-$VERSION.tar.gz" release/router-api-linux-amd64.tar.gz
          (cd release && sha256sum router-api-linux-amd64.tar.gz > router-api-linux-amd64.tar.gz.sha256)
          gh release create "v$VERSION" release/router-api-linux-amd64.tar.gz release/router-api-linux-amd64.tar.gz.sha256 --target "$GITHUB_SHA" --title "Stage $RELEASE_STAGE $VERSION" --notes "Stage $RELEASE_STAGE package from commit $GITHUB_SHA." --latest
