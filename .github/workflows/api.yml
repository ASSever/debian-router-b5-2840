name: Go API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Check Go formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l cmd/router-api/*.go internal/admin/admin.go internal/admin/admin_test.go internal/authsession/*.go internal/database/database.go internal/database/database_test.go)
          if [ -n "$unformatted" ]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Name the package
        id: version
        shell: bash
        run: echo "value=0.1.0-step11-$(TZ=Europe/Moscow date +%Y%m%d-%H%M)-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build and verify the release package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sh scripts/package.sh "$VERSION"
          cd "dist/$VERSION"
          sha256sum -c "debian-router-b5-2840-$VERSION.tar.gz.sha256"
          tar -tzf "debian-router-b5-2840-$VERSION.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-router-b5-2840-${{ steps.version.outputs.value }}-linux-amd64
          path: dist/${{ steps.version.outputs.value }}/*
          if-no-files-found: error
