name: Go API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Build and verify the release package
        run: |
          sh scripts/package.sh 0.1.0
          cd dist/0.1.0
          sha256sum -c debian-router-b5-2840-0.1.0.tar.gz.sha256
          tar -tzf debian-router-b5-2840-0.1.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: debian-router-b5-2840-0.1.0-linux-amd64
          path: dist/0.1.0/*
          if-no-files-found: error
