name: Go API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Build for the target architecture
        working-directory: backend
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/router-api ./cmd/router-api
